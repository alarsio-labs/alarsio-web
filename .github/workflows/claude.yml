# Claude Code in CI.
#
# Set this up by running  /install-github-app  inside Claude Code in the terminal.
# That installs the GitHub app and adds the secret for you. You must be a repo admin.
#
# Once installed, mention @claude in any issue or PR comment and it will work on it.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when a repo member or collaborator asks for it. This repo is public, so a
    # mention from anyone else must not start a job that holds write permissions.
    if: >-
      (contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # v1, pinned to a commit so a moved tag cannot change what runs with our secret.
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
